name: tests

on:
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "tests/**"
      - ".claude/skills/swarm/SKILL.md"
      - ".claude/commands/**"
      - ".claude/skills/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "tests/**"
      - ".claude/skills/swarm/SKILL.md"
      - ".claude/commands/**"
      - ".claude/skills/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # test_archived_files_stay_recoverable_from_history runs `git log --all --follow`,
          # which returns nothing under the default depth-1 clone.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install --quiet pyyaml
      - name: Install br
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/br-0.7.4-linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/br-bin"
          curl --fail --location --silent --show-error \
            https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.7.4/br-0.7.4-linux_amd64.tar.gz \
            --output "$archive"
          echo "ba9e493175a1859b4d0427ad32e8636b26a128416041ed7bc7d41ab81ddc3333  $archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" --no-same-owner br
          test "$("$install_dir/br" --version)" = "br 0.7.4"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run repo contract tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
