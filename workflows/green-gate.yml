name: Green Gate

# Green Gate = exactly two gates, both evaluated at the current PR HEAD SHA
# (operator-directed canonical /green definition, 2026-07-28):
#   Gate 1 — CI green: each test workflow reports its own status on the PR.
#     NOTE: branch protection on main currently declares NO required status
#     checks (verified 2026-07-28), so all checks — including this one — are
#     visible signals, not mechanical merge blocks, unless the operator adds
#     required contexts. This workflow does NOT re-poll other checks — doing
#     so from inside Green Gate was the mechanism behind the 50.7% cancel
#     rate identified in the 2026-07-26 CI v2 audit (bead rev-qc9fi).
#   Gate 2 — No merge conflicts: this workflow's sole job. Polls
#     `mergeable` up to 8x30s while GitHub computes it (null), passes when
#     mergeable, fails when DIRTY, and fails CLOSED if mergeability is still
#     unknown after all attempts. This is a point-in-time signal: a sibling
#     PR merging later can make it stale; GitHub's merge box re-evaluates
#     authoritatively at merge time.
#
# Everything else that used to gate merge here (CodeRabbit/Bugbot approval,
# comment-thread resolution, evidence-link checks, PR-description checks, the
# old "6-green" numbering) moved to the DRAFT phase: PRs are opened as draft
# and stay draft until /es, /er, and /advice pass; only then do they flip to
# ready-for-review and get driven through this two-gate check.
#
# The job id and display name below ("green_gate" / "Green Gate") are kept
# identical to the pre-downscope workflow so branch protection's required
# status check ("Green Gate") continues to match without reconfiguration.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: green-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  green_gate:
    name: Green Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Merge-conflict check (Gate 2)
        id: mergeable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MERGEABLE=""
          for _attempt in 1 2 3 4 5 6 7 8; do
            RESP=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            MERGEABLE=$(echo "$RESP" | jq -r '.mergeable')
            MERGEABLE_STATE=$(echo "$RESP" | jq -r '.mergeable_state')
            if [ "$MERGEABLE" != "null" ]; then
              break
            fi
            echo "Gate 2: mergeable still UNKNOWN (attempt ${_attempt}/8) — sleeping 30s"
            sleep 30
          done

          echo "Gate 2: mergeable=${MERGEABLE} mergeable_state=${MERGEABLE_STATE}"

          if [ "$MERGEABLE" = "null" ]; then
            echo "GATE-2 FAIL (fail-closed): mergeability still unknown after 8 attempts"
            exit 1
          fi

          if [ "$MERGEABLE" = "false" ] || [ "$MERGEABLE_STATE" = "dirty" ]; then
            echo "GATE-2 FAIL: PR has merge conflicts (mergeable_state=${MERGEABLE_STATE})"
            exit 1
          fi

          echo "GATE-2 PASS: no merge conflicts (mergeable_state=${MERGEABLE_STATE})"

      - name: Final verdict
        run: |
          echo "=== GREEN GATE: PASS ==="
