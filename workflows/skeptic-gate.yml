name: Skeptic Gate

# DEPRECATED / RETIRED — no-op stub.
#
# The Skeptic merge gate (the former "Gate 7") is REMOVED/not used. `/green` is
# exactly TWO gates, both verified at the PR's current HEAD SHA:
#   1. CI green
#   2. No merge conflicts
# See .claude/skills/pr-green-definition/SKILL.md (canonical `/green`) and
# .claude/skills/draft-first-pr/SKILL.md (full lifecycle).
#
# Skeptic: REMOVED/not used. CodeRabbit: optional advisory (never a gate).
# Bugbot: optional advisory (never a gate).
#
# This stub is retained only so any existing "Skeptic Gate" status-check name
# continues to report success instead of blocking PRs on a workflow that no
# longer performs a merge gate.

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (ignored — deprecated)"
        required: false
        type: string
      head_sha:
        description: "PR head commit SHA (ignored — deprecated)"
        required: false
        type: string

jobs:
  skeptic_gate:
    name: Skeptic Gate
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated no-op
        run: |
          echo "Skeptic Gate is retired. /green = CI green + no merge conflicts (2 gates)."
          echo "Skeptic: REMOVED/not used; CodeRabbit and Bugbot: optional advisory reviewers."
